<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Toast & Delete Modal Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Plus Jakarta Sans", sans-serif; background: #F1F5F9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 40px; }

  h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #94A3B8; margin-bottom: 12px; }

  /* ── Trigger Buttons ── */
  .demo-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; border: none; transition: all 0.18s; }
  .btn-success { background: #10B981; color: #fff; }  .btn-success:hover { background: #059669; }
  .btn-error   { background: #EF4444; color: #fff; }  .btn-error:hover   { background: #DC2626; }
  .btn-warning { background: #F59E0B; color: #fff; }  .btn-warning:hover { background: #D97706; }
  .btn-delete  { background: #FEE2E2; color: #DC2626; border: 1.5px solid #FCA5A5; } .btn-delete:hover { background: #FCA5A5; }
  .btn-outline { background: #fff; color: #1E3A8A; border: 1.5px solid #E2E8F0; } .btn-outline:hover { background: #F8FAFC; }
  .btn-primary { background: #1E3A8A; color: #fff; } .btn-primary:hover { background: #1e3070; }

  /* ── Toast Container ── */
  #toast-wrap { position: fixed; top: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; pointer-events: none; }

  /* ── Toast ── */
  .toast {
    display: flex; align-items: center; gap: 10px;
    border-radius: 12px; padding: 13px 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
    min-width: 280px; max-width: 380px;
    pointer-events: all;
    animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .toast.hiding { animation: toastOut 0.28s ease forwards; }

  .toast-success { background: #D1FAE5; border: 1.5px solid #10B981; }
  .toast-error   { background: #FEE2E2; border: 1.5px solid #EF4444; }
  .toast-warning { background: #FEF3C7; border: 1.5px solid #F59E0B; }

  .toast-icon.success { color: #10B981; }
  .toast-icon.error   { color: #EF4444; }
  .toast-icon.warning { color: #F59E0B; }

  .toast-msg { flex: 1; font-size: 13px; font-weight: 600; line-height: 1.4; }
  .toast-msg.success { color: #065F46; }
  .toast-msg.error   { color: #991B1B; }
  .toast-msg.warning { color: #92400E; }

  .toast-close { background: none; border: none; cursor: pointer; opacity: 0.5; display: flex; align-items: center; transition: opacity 0.15s; }
  .toast-close:hover { opacity: 1; }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(60px) scale(0.92); }
    to   { opacity: 1; transform: translateX(0)    scale(1);    }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateX(0)    scale(1);    max-height: 80px; margin-bottom: 0; }
    to   { opacity: 0; transform: translateX(60px) scale(0.92); max-height: 0;    margin-bottom: -10px; }
  }

  /* ── Delete Confirm Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 8000; backdrop-filter: blur(3px);
    animation: fadeIn 0.18s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .confirm-modal {
    background: #fff; border-radius: 16px; padding: 32px 28px 24px;
    max-width: 380px; width: 90%;
    box-shadow: 0 24px 60px rgba(0,0,0,0.18);
    animation: modalIn 0.28s cubic-bezier(0.34,1.56,0.64,1);
    text-align: center;
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.88) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

  .confirm-icon-wrap {
    width: 64px; height: 64px; border-radius: 50%;
    background: #FEE2E2; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .confirm-title { font-size: 18px; font-weight: 800; color: #0F172A; margin-bottom: 8px; }
  .confirm-sub   { font-size: 13px; color: #64748B; line-height: 1.5; margin-bottom: 24px; }
  .confirm-actions { display: flex; gap: 10px; justify-content: center; }
  .confirm-actions .btn { min-width: 120px; justify-content: center; }

  /* ── Progress bar on toast ── */
  .toast-progress {
    position: absolute; bottom: 0; left: 0;
    height: 3px; border-radius: 0 0 12px 12px;
    animation: shrink 3.2s linear forwards;
  }
  .toast { position: relative; overflow: hidden; }
  .toast-success .toast-progress { background: #10B981; }
  .toast-error   .toast-progress { background: #EF4444; }
  .toast-warning .toast-progress { background: #F59E0B; }
  @keyframes shrink { from { width: 100%; } to { width: 0%; } }

  /* ── Demo card ── */
  .demo-card { background: #fff; border-radius: 16px; padding: 28px 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; max-width: 600px; width: 100%; }
  .demo-card h1 { font-size: 22px; font-weight: 800; color: #0F172A; margin-bottom: 6px; }
  .demo-card p  { font-size: 13px; color: #64748B; margin-bottom: 24px; }
  .material-symbols-outlined { font-size: 20px; line-height: 1; vertical-align: middle; }
</style>
</head>
<body>

<div class="demo-card">
  <h1>Toast &amp; Delete Modal Preview</h1>
  <p>Click the buttons below to preview each style</p>

  <h2>Toast Notifications</h2>
  <div class="demo-row" style="margin-bottom:24px;">
    <button class="btn btn-success" onclick="showToast('Company created successfully!','success')">
      <span class="material-symbols-outlined">check_circle</span> Success Toast
    </button>
    <button class="btn btn-error" onclick="showToast('Failed to delete company.','error')">
      <span class="material-symbols-outlined">cancel</span> Error Toast
    </button>
    <button class="btn btn-warning" onclick="showToast('Company has active employees.','warning')">
      <span class="material-symbols-outlined">warning</span> Warning Toast
    </button>
  </div>

  <h2>Delete Confirmation Modal</h2>
  <div class="demo-row">
    <button class="btn btn-delete" onclick="showConfirm()">
      <span class="material-symbols-outlined">delete</span> Delete Company
    </button>
  </div>
</div>

<!-- Toast container -->
<div id="toast-wrap"></div>

<!-- Confirm modal (hidden by default) -->
<div id="confirm-overlay" class="modal-overlay" style="display:none;" onclick="hideConfirm(event)">
  <div class="confirm-modal" onclick="event.stopPropagation()">
    <div class="confirm-icon-wrap">
      <span class="material-symbols-outlined" style="color:#EF4444;font-size:32px;font-variation-settings:'FILL' 1;">delete_forever</span>
    </div>
    <div class="confirm-title">Delete Company?</div>
    <div class="confirm-sub">This will permanently remove <strong>Workiya Pvt. Ltd.</strong> and all associated data. This action cannot be undone.</div>
    <div class="confirm-actions">
      <button class="btn btn-outline" onclick="hideConfirm()">Cancel</button>
      <button class="btn btn-error" onclick="confirmDelete()">
        <span class="material-symbols-outlined">delete</span> Yes, Delete
      </button>
    </div>
  </div>
</div>

<script>
  let toastId = 0;

  function showToast(message, type = "success") {
    const wrap = document.getElementById("toast-wrap");
    const id   = ++toastId;
    const div  = document.createElement("div");
    div.className = `toast toast-${type}`;
    div.id = `toast-${id}`;
    div.innerHTML = `
      <span class="material-symbols-outlined toast-icon ${type}" style="font-variation-settings:'FILL' 1;font-size:20px;flex-shrink:0;">
        ${ type === "success" ? "check_circle" : type === "error" ? "cancel" : "warning" }
      </span>
      <span class="toast-msg ${type}">${message}</span>
      <button class="toast-close" onclick="removeToast(${id})">
        <span class="material-symbols-outlined" style="font-size:16px;color:#64748B;">close</span>
      </button>
      <div class="toast-progress"></div>
    `;
    wrap.appendChild(div);

    setTimeout(() => removeToast(id), 3200);
  }

  function removeToast(id) {
    const el = document.getElementById(`toast-${id}`);
    if (!el) return;
    el.classList.add("hiding");
    setTimeout(() => el.remove(), 280);
  }

  function showConfirm() {
    document.getElementById("confirm-overlay").style.display = "flex";
  }

  function hideConfirm(e) {
    if (e && e.target !== document.getElementById("confirm-overlay")) return;
    document.getElementById("confirm-overlay").style.display = "none";
  }

  function confirmDelete() {
    document.getElementById("confirm-overlay").style.display = "none";
    showToast("Company deleted successfully!", "success");
  }
</script>
</body>
</html>
